          type: string
  /api/contents:
    post:
      summary: ''
      operationId: postApiContents
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Must not be greater than 255 characters. Must be at least 3 characters.'
                  example: vmqeopfuudtdsufvyvddqamniihfqcoynlazghdtqtqxbajwbpilpmufinllwloauydlsmsjur
                  nullable: false
                body:
                  type: string
                  description: 'Must be at least 3 characters.'
                  example: yvojcybzvrbyickznkygloigmkwxphlvazjrcnfbaqywuxhgjjmzuxjubqouzswiwxtrkimfca
                  nullable: false
                organization_id:
                  type: integer
                  description: ''
                  example: 17
                  nullable: true
                start_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2025-11-17T18:41:04'
                  nullable: false
                end_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2025-11-17T18:41:04'
                  nullable: false
                uploaded_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2025-11-17T18:41:04'
                  nullable: true
                location:
                  type: string
                  description: 'Must not be greater than 255 characters. Must be at least 3 characters.'
                  example: mqeopfuudtdsufvyvddqamniihfqcoynlazghdtqtqxbajwbpilpmufinllwloauydlsmsjury
                  nullable: false
                create_event:
                  type: string
                  description: ''
                  example: '1'
                  nullable: false
                  enum:
                    - '0'
                    - '1'
                create_post:
                  type: string
                  description: ''
                  example: '1'
                  nullable: false
                  enum:
                    - '0'
                    - '1'
      security: []
